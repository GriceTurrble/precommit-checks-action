name: CD
permissions: write-all
on:
  push:
    branches: [main]

jobs:
  release:
    permissions:
      # Required in order to create releases and tags.
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: griceturrble/github-actions-cd-action@cc40d1d73b2260a8699aff286dd7f97b995fc120 # v1
